name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          python3 --version

      - name: 资源存在性检查
        run: |
          for f in NpcLab/Resources/skills.json \
                   NpcLab/Resources/skillbody.json \
                   NpcLab/Resources/presets.json \
                   NpcLab/Resources/tools.json \
                   NpcLab/Resources/persona.md; do
            test -f "$f" || { echo "缺 $f"; exit 1; }
            ls -lh "$f"
          done

      - name: rootfs 检查
        run: |
          # 大文件不在 git 里，先按分段拼回 zip
          bash Tools/join_rootfs.sh
          du -h NpcLab/Resources/alpine-rootfs.zip
          unzip -l NpcLab/Resources/alpine-rootfs.zip | tail -3
          # 架构对不对，在这里就拦下：内核是 ARM64 guest 模拟，rootfs 必须是 aarch64，
          # 否则 execve 全 -ENOEXEC，装到手机上点终端直接闪退。
          python3 Tools/build_rootfs.py --check --arch aarch64 --zip NpcLab/Resources/alpine-rootfs.zip

      # llvm 不是可选项：iSH ARM64 的 VDSO 必须用 clang + lld 交叉编成 aarch64 ELF，
      # Xcode 自带 clang 不认识 -fuse-ld=lld，缺 llvm 会停在 vdso/arm64/meson.build。
      # 注意：Homebrew 从 llvm 19 起把 lld 拆成独立公式，要单独装。
      - name: 装 meson / ninja / llvm / lld
        run: |
          for p in meson ninja llvm lld; do
            brew list "$p" >/dev/null 2>&1 || brew install "$p"
          done
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin"  >> "$GITHUB_PATH"
          /opt/homebrew/opt/llvm/bin/clang --version | head -1
          command -v ld.lld
          # 直接跑 iSH ARM64 分支自带的探测脚本，它过了 VDSO 就一定编得出来
          bash deps/ish/vdso/arm64/check-cc-arm64.sh /opt/homebrew/opt/llvm/bin/clang

      # 交叉编译 iSH 的 Linux 内核（ARM64 guest）。第一次要 20-40 分钟，之后有缓存会快很多。
      - name: 缓存 iSH 构建
        uses: actions/cache@v4
        with:
          path: deps/ish/build-ios
          key: ish-arm64-v1-${{ runner.os }}-${{ hashFiles('deps/ish/meson.build') }}

      - name: 编译 iSH 内核
        run: bash Tools/build_ish.sh
        timeout-minutes: 90

      # 打包直接走 build_ipa.sh，跟本地一条路径：它会重生成工程、编 Release、
      # 自检扩展/rootfs/内核符号/权限文案/18 种 .lproj，任何一项不过就 exit 1。
      - name: 编译 + 打包 ipa
        run: bash Tools/build_ipa.sh

      - name: 产物清单
        run: |
          ls -lh dist/
          unzip -l "dist/小徐TuT.ipa" | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: 小徐TuT-ipa
          path: dist/小徐TuT.ipa
          retention-days: 30
